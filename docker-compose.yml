# docker-compose.yml

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: orion-qdrant

    restart: unless-stopped

    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC

    volumes:
      - ./data/qdrant:/qdrant/storage

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: orion-neo4j

    restart: unless-stopped

    ports:
      - "7474:7474" # Browser
      - "7687:7687" # Bolt

    environment:
      NEO4J_AUTH: neo4j/orion123
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 512M

    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/plugins:/plugins

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
